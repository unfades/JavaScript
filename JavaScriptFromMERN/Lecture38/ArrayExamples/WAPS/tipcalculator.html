<!DOCTYPE html>

    <table border="2">
        <script>
            //mine is like this
            document.write("<h1>Restaurant Tip Calculator</h1>");
            let n = prompt("How many people are billed?", "enter here");
            let bills = [];
            for (let i = 0; i < n; i++) {
                let tip = 0;
                bills[i] = Number(prompt("how much was your bill?:", "enter here"));
                if (bills[i] < 250) tip = bills[i] + bills[i] * 0.20;
                if (bills[i] >= 250 && bills[i] <= 500) tip = bills[i] + bills[i] * 0.15;
                if (bills[i] > 500) tip = bills[i] + bills[i] * 0.10;
                document.write("<tr><td>");
                document.write(`The original bill${i}: ${bills[i]} and the bill${i} with tip: ${tip}<br>`);
                document.write("</td><tr>");
            }
        </script>
        </table>
