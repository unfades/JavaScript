<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let str = prompt("Enter a string:");
        document.write(`length: ${str.length}<br>`);
        document.write(`1stchar: ${str.charAt(0)}<br>`);
        document.write(`lastchar: ${str.charAt(str.length-1)}<br>`);
    </script>
</head>

</body>
</html>
