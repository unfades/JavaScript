<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let evenodd = check => check%2==0? "even": "odd";
        //sir's was 
        eveodd = n => n%2==0? `${n} is even`:`${n} is odd`;
        document.write(evenodd(3)+"<br>");
        document.write(evenodd(4)+"<br>");
        document.write(eveodd(5)+"<br>");
    </script>
</head>
<body>
    arrow function check even or odd, one liner go go go
</body>
</html>
