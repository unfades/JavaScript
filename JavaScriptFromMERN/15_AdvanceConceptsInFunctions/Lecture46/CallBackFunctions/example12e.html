    <title>Even In Arrays We have discussed Callbacks before</title>
    <script>


        //inside this first 1,2 compared and passed, then 2,9 passed, etc etc
        //sorts them based on that logic.
        let arr = [1,2,9,2,1,51,90,-1];
        document.write(`before sorting:${arr}<br>`);
        
        arr.sort((a,b) => a-b);
        document.write(`after sorting:${arr}<br>`);
    </script>
