<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even In Arrays We have discussed Callbacks before</title>
    <script>


        //inside this first 1,2 compared and passed, then 2,9 passed, etc etc
        //sorts them based on that logic.
        function compare(a,b){
            if(a>b) return 1;
            else if(a<b) return -1;
            else return 0;
        }

        let arr = [1,2,9,2,1,51,90,-1];
        document.write(`before sorting:${arr}<br>`);
        //before this is just gonna sort based on ascii
        arr.sort(compare); //now sorts based on our logic...
        //inside here we can also pass a function like a callback... see ex 12a
        document.write(`after sorting:${arr}<br>`);
    </script>
    

</head>
<body>
    
</body>
</html>
