    <script>
        let student = {name: "Sumit", age: 15, phy:45,chem:50, maths:65};
        let marks = 0;
        for(let x in student){
            if(!isNaN(student[x])) marks+=student[x];
        }
        document.write(`total marks that ${student.name} scored: ${marks}WRONGWRONG<br>`);
        //THIS IS WRONG.

            if(typeof student[x] === "number" && x!="age") marks+=student[x]; //noice and right too
