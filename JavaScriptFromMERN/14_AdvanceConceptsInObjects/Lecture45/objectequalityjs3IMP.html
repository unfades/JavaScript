<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY Way for Object Equality check in JS using JSON</title>
    //cdnjs 
    //CDN means content delivery network
    //we get functionality from here
    <script src = "//cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script>
        let p1 = {
            name: "harry",
            gender: "male",
        };
        let p2 = {
            gender: "male",
            name: "harry",
        };
        //false cause the orders different
        document.write(JSON.stringify(p1) === JSON.stringify(p2));
        //true cause the content is the same via cdnjs lodash
        document.write(_.isEqual(p1,p2) + "<br>");
    </script>
</head>
<body>
    <p>We have to stringify our objects and then use === to compare them</p>

    <p>This is done with a method called stringify()</p>
    
    
</body>
</html>
