<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY Way for Object Equality check in JS using JSON</title>
    <script>
        let p1 = {
            name: "harry",
            age: 25,
        };
        let p2 = {
            name: 25,
            name: "harry",
        };
        document.write(JSON.stringify(p1) === JSON.stringify(p2));
    </script>
</head>
<body>
    <p>We have to stringify our objects and then use === to compare them</p>

    <p>This is done with a method called stringify()</p>
    <p>stringify fails now because the order is different...</p>
    <p>loadash can overcome this...</p>
</body>
</html>
