<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Push Method</title>
    <script>
        let fruits = ["guava", "apple", "grapes", "banana"];
        document.write(`Size:${fruits.length}<br>`);
        document.write(`Values:${fruits}<br>`);

        fruits2 = fruits.slice(-3);
        //this means it will copy everything from banana to -3 index which is apple
        //so itllbe apple grapes banana
        document.write(`Original array values: ${fruits}<br>`);
        document.write(`Size:${fruits2.length}<br>`);
        document.write(`Sliced Values:${fruits2}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
