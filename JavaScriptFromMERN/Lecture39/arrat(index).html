<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        let evens = [2,4,6,8,10];
        document.write(`${evens.at(2)}<br>`); //6
        document.write(`${evens.at(-2)}<br>`); //negative indexing allowed so its 8
        document.write(`${evens.at(7)}<br>`); //undefined
    </script>
</head>
