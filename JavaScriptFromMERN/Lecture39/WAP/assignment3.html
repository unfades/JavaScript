<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let arr = [5,5,5,100,4,9,3,6,7,9,1,1,4,3,1,100,4];
        document.write(arr + "<br>");
        const myset = new Set();
        for(let i = 0; i<arr.length; i++){
            if(!myset.has(arr[i])){
                myset.add(arr[i]);
                document.write(`myset is ${myset}<br>`);
            }else{
                arr.splice(arr.indexOf(arr[i]),1);
                i--;
            }
        }
        document.write(arr);
    </script>
</head>

</body>
</html>
