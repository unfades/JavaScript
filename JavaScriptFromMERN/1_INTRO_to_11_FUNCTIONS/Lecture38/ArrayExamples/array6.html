<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let evens = [2,4,6,8,10,12];
        let evens2 = [2, ,6,10, ,14];
        document.write(evens + "<br>");
        document.write("evens length is " + evens.length + "<br>");

        for(let i = 0; i<evens.length; i++)
            document.write(evens[i] + "<br>");
        document.write(evens2 + "<br>");
        document.write("evens2 length is " + evens2.length + "<br>");
        //valid traversal but this way now is outdated in JS
        for(let i = 0; i<evens2.length; i++)
            document.write(evens2[i] + "<br>");
    </script>
