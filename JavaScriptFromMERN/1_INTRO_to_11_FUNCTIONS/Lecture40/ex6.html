<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Calling Function On Button click</title>
    <script>
      function greetings(name) {
        document.write(`Good Evening ${name}<br>`);
      }
    </script>
  </head>
  <body>
    <input type="button" value="click me" onclick="greetings('Sachin')"/>
  </body>
</html>
