<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Push Method</title>
    <script>
        let arr = [1,2,3,4];
        document.write(`Size:${arr.length}<br>`);
        document.write(`Values:${arr}<br>`);

        //arr.splice(0,4,400,400,400,400); instead of this...
        //this
        arr.fill(400,1,2);
        //means that itll start at 1, stops just before 2, and fills them as 400
        //so its 1 400 3 4
        document.write(`Size:${arr.length}<br>`);
        document.write(`Filled Values:${arr}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
