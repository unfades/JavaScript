<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Push Method</title>
    <script>
        let fruits = ["guava", "apple", "grapes", "banana"];
        document.write(`Size:${fruits.length}<br>`);
        document.write(`Values:${fruits}<br>`);

        fruits.splice(2,1); //at index 2 remove 1 element
        document.write(`Size:${fruits.length}<br>`);
        document.write(`Values:${fruits}<br>`);
        document.write('hi');
    </script>
</head>
<body>
    
</body>
</html>
