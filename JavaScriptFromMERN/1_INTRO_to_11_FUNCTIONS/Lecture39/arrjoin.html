<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //like javas split, join,
        let fruits = ["apple", "fruits", "banana"];
        let str = fruits.join(); // "apple,fruits,banana";
        document.write(`${str}<br>`);
        str = fruits.join("-"); // "apple-fruits-banana";
        document.write(`${str}<br>`);


    </script>
</head>
