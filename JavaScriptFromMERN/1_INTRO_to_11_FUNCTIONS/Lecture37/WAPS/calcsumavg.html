<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num, amt = 0, sum = 0;
        while(true){
            let num = Number(prompt("Enter a number", "enter here"));
            if(num === 0) break;
            amt++;
            sum+=num;
        }
        document.write("sum: "+ sum + "<br>");
        document.write("avg: "+ sum/amt + "<br>");
    </script>
</head>
<body>
    
</body>
</html>
