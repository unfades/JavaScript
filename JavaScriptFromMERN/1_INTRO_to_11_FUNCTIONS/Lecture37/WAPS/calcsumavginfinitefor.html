<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num, amt = 0, sum = 0;
        for( ; ; ){
            let num = Number(prompt("Enter a number", "enter here"));
            if(num === 0) break;
            amt++;
            sum+=num;
        }
        document.write("sum: "+ sum + "<br>");
        /*just letting you know that I know
        how to use toFixed() like String.format() from Java*/
        document.write("avg: "+ (sum/amt).toFixed(1) + "<br>");
    </script>
</head>
<body>
    
</body>
</html>
