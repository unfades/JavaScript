<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Function Demo</title>
    <script>
      function greetings(name) {
        document.write(`Good Evening ${name}<br>`);
        //document.write(`Good Evening ${arguments[1]}<br>`);
      }
      greetings("Sachin");
      greetings();
      greetings("Nitin","Deepak");
    </script>
  </head>
  <body></body>
</html>
