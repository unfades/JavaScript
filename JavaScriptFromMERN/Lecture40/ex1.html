<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Function Demo</title>
    <script>
        function greetings(){
            document.write("Welcome to JS");
        }
        greetings();
    </script>
</head>
<body>
    <script>
        greetings(); //also can run in the body with script tags
    </script>
</body>
</html>
