<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let marks1 = Number(prompt("enter marks for sub1", "enter here"));
        let marks2 = Number(prompt("enter marks for sub2", "enter here"));
        let marks3 = Number(prompt("enter marks for sub3", "enter here"));
        let marks4 = Number(prompt("enter marks for sub4", "enter here"));
        let marks5 = Number(prompt("enter marks for sub5", "enter here"));

        let nextclass = 0;
        let avgscore = (marks1+marks2+marks3+marks4+marks5)/5;
        marks1>=60? nextclass++: nextclass+=0;
        marks2>=60? nextclass++: nextclass+=0;
        marks3>=60? nextclass++: nextclass+=0;
        marks4>=60? nextclass++: nextclass+=0;
        marks5>=60? nextclass++: nextclass+=0;
        let promoted = false;
        nextclass>=4 && avgscore>=60? promoted = true: promoted = false;
        promoted = promoted === true? "you are going to the next class":"you are not going to the next class";
        document.write(`Your average mark are: ${avgscore}, <br>
                        You have passed ${nextclass} classes, <br>
                        and ${promoted}`);
    </script>
</head>
<body>
    
</body>
</html>
