<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function changeColor(ref, c){
            document.body.bgColor = c;
        }
    </script>
</head>
<body>
    <h3>Select an option to change page background color</h3>
    <input type="radio" name="r1" onclick="changeColor(this, 'red')"> Red <br>
    <input type="radio" name="r1" onclick="changeColor(this, 'green')"> Green <br>
    <input type="radio" name="r1" onclick="changeColor(this, 'blue')"> Blue <br>

</body>
</html>
