<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even In Arrays We have discussed Callbacks before</title>
    <script>
        let arr = [1,2,9,2,1,51,90,-1];
        document.write(`before sorting:${arr}<br>`);
        arr.sort((a,b) => b-a); //to reverse sort just b-a thats it
        document.write(`after sorting:${arr}<br>`);
    </script>
</head>
