<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let evenodd = check => check%2==0? "even": "odd";
        document.write(evenodd(3));
        document.write(evenodd(4));
    </script>
</head>
<body>
    arrow function check even or odd, one liner go go go
</body>
