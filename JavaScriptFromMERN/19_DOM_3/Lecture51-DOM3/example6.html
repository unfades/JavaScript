<html>
	<head>
		<title>Adding New Para</title>

		<script>
			function addPara() {
				///create a new para and add it in the div
				let div = document.querySelector("div");
                let p = document.createElement("p");
                let children = div.children;
                let x = children.length + 1;
                // let text = document.createTextNode("I am para " + x);
                //instead of doing all that we can also make it short like this
                let text = document.createTextNode("I am para " + (div.children.length+1));
                p.appendChild(text);
                div.appendChild(p);
			}
		</script>
	</head>

	<body>
		<div id="d1">
			<p id="p1">I am para 1</p>
			<p id="p2">I am para 2.</p>
		</div>
		<input type="button" value="add new para" onclick="addPara();" />
	</body>
</html>
