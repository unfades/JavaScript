      function operate() {
        // change font color of all children of div to crimson
        let div = document.querySelector("div");

        console.log(children);
        children.forEach((ch) => {
            //for not including normal text nodes due to enter pressing.
            //we shouldnt use these properties then since we want only element nodes.
            
            if(ch.nodeType === 1)
