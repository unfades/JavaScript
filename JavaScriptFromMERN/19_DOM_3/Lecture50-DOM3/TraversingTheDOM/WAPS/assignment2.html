<html>
  <head>
    <title>Sharma Computer Academy</title>
    <link rel="stylesheet" href="../../mystyles.css">
    <script>
      function operate() {
        //add class highlight to all children of div
        let div = document.querySelector("div");
        let arr = div.children;
        arr = Array.from(arr);
        arr.forEach((ch) => {
            ch.classList.add("highlight");
        });
      }
    </script>
  </head>

  <body>
    <div>
      <h2 align="center">Welcome To SCA</h2>
      <h3>Our Mission</h3>
      <p>
        The mission of the SHARMA COMPUTER ACADEMY is to provide its students
        with the foundation for lifelong learning
      </p>
      <h3>Our Courses</h3>
      <ul>
        <li>C</li>
        <li>C++</li>
        <li>Python</li>
        <li>Django</li>
        <li>Java</li>
        <li>Oracle</li>
      </ul>
    </div>
    <input type="button" value="Click me" onclick="operate()" />
  </body>
</html>
