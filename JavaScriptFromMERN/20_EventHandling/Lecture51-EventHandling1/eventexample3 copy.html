<html>
	<head>
		<title>Event Demo</title>
		<script>
			function changeColor(color) {
				if(color === 'red'){
					let div = document.querySelector("#div1");
					div.style.backgroundColor = "red";
				}
				if(color === 'yellow'){
					let div = document.querySelector("#div2");
					div.style.backgroundColor = "yellow";
				}
			}
		</script>
		<style type="text/css">
			#div1 {
				width: 300px;
				height: 200px;
				border: solid 1px black;
			}

			#div2 {
				width: 300px;
				height: 200px;
				border: solid 1px black;
			}
		</style>
	</head>

	<body>
		<div id="div1" onclick="changeColor('red')">
			Click to change color to RED
		</div>
		<div id="div2" onclick="changeColor('yellow')">
			Click to change color to YELLOW
		</div>
	</body>
</html>
