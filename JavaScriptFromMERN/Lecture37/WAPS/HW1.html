<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = prompt("Enter month number(1-12):", "Enter here");
        num = Number(num);
        let str = "";
        switch(num){
            case 11: case 12: case 1: case 2:
                str = "Winter";
                break;
            case 3: case 4: case 5: case 6:
                str = "Summer";
                break;
            case 7: case 8: case 9: case 10:
                str = "Rainy";
                break;
            default:
                str = "Wrong month number";
                break;
        }
        document.write(str);
    </script>
</head>
<body>
    <p>Write a program to accept a month number from the user and display the name
        of the season in which the given month falls as per the table given below:
        Month number  - Season name
        11,12,1,2       Winter
        3,4,5,6         Summer
        7,8,9,10        Rainy
        Any other val   Wrong month number
    </p>
</body>
</html>
