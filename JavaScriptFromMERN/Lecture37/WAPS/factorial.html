<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = Number(prompt("Enter a number to get the factorial: ", "enter here"));
        let fact = 1;
        while(num>0){
            fact*=num--;
        }
        document.write(fact);
        document.write("<br>"+ typeof fact);
    </script>
</head>

</body>
