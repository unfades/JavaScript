<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = prompt("Enter a number for a times table:","enter here");
        num = Number(num);
        let i = 1;
        while(i<=10){
            document.write(`${num} x ${i} = ${num*i + '<br>'}`);
            i++;
        }
    </script>
</head>
<body>
    
</body>
</html>
