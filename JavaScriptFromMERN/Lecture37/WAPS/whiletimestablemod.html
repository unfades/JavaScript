<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        tr:nth-child(even) {background-color: #000000; color: white;}
    </style>
    <script>
        let num = prompt("Enter a number for a times table:","enter here");
        num = Number(num);
        let i = 1;
        document.write(`<h1>Table of ${num}</h1>`)
        document.write('<table border = \'2\'>');
        while(i<=10){
            document.write('<tr>');
            document.write('<td>');
            document.write(`${num} x ${i} = ${num*i + '<br>'}`);
            document.write('</td>');
            i++;
            document.write('</tr>');
        }
        document.write('</table>');
    </script>
</head>
<body>
    
</body>
</html>
