<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Scope Ex</title>
    <script>
      var a=10; //global
      function f1(){
        var a = 20; //local to f1
        alert(`Inside f1 a is ${a}`); //local a
        alert(`Inside f1 a is ${window.a}`); //global a
      }
      function f2(){
        var a = 30; //local to f2
        alert(`Inside f2 a is ${a}`);
        alert(`Inside f2 a is ${window.a}`);
      }
    </script>
  </head>
  <body>
    <input type="button" value="call f1" onclick="f1()" />
    <br>
    <input type="button" value="call f2" onclick="f2()" />
  </body>
</html>
