<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = parseInt(prompt("Enter first number"));
        let b = parseInt(prompt("Enter second number"));
        document.write("<b>a=" + a + ", b = " + b + "</b><br>");
        document.write("<b>Sum is " + (a + b) + "</b><br>");
        document.write("<b>Diff is " + (a - b) + "</b><br>");
        document.write("<b>Prod is " + a * b + "</b><br>");
        document.write("<b>Quot is " + a / b + "</b><br>");
        document.write("<b>Mod is " + (a % b) + "</b><br>");
    </script>
</head>
<body>
    
</body>
</html>
