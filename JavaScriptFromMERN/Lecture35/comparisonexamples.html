<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators in JS</title>

    <script>
        /*
        notes for me
        == this is loose equal to in JS
        === this is strict equal to in JS
        -----------------------------------
        != this is loose not equal to in JS
        !== this is loost not equal to in JS
        */
        let a = 10, b = "10", c = 10;
        //check your understanding, know your comparison operators by guessing the output
        document.write((a == b) + "<br>"); //output? true because loose equals to auto type converts
        document.write((a == c) + "<br>"); //output? true
        document.write((a === b) + "<br>"); //output? false
        document.write((a === c) + "<br>"); //output? true
        //the rest are the same as in C/C++, Java
        //unless ur intentionally wanting to have type convertion, then JS recommends using ===
        document.write("yuh yuh yuh <br>");
        var w = true, x = 1, y = false, z = 0;
        /*
        != only compares values, if the value is different, then its true
        !== compares both values and types, if the type or value is different, then its true
        */
        // == and != only concern values, === and !== concern both values and types both
        document.write((w == x) + "<br>"); // true == 1 is true
        document.write((w === x) + "<br>"); // true === 1 is false
        document.write((y == z) + "<br>"); // false == 0 is true
        document.write((y === z) + "<br>"); // false === 0 is false
        document.write((w != x) + "<br>"); // -> false
        document.write((w !== x) + "<br>"); // -> true
        document.write((y != z) + "<br>"); // -> false
        document.write((y !== z) + "<br>"); // -> true
    </script>
</head>

<body>

</body>

</html>
