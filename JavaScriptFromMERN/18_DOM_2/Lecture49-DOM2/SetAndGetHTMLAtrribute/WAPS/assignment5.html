<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = 0;
        function changeLogo(){
            let img = document.querySelector("img");
            if(a%2 == 0){
                img.setAttribute("src","../images/eiffel.jpg");
            }else{
                img.setAttribute("src","../images/bakery.jpg");
            }
            a++;
        }
    </script>
</head>
<body>

    <h3>A pic</h3>
    <img src="../images/bakery.jpg" alt="a bakery"><br>
    <input type="button" value="Change Logo" onclick = "changeLogo()">
