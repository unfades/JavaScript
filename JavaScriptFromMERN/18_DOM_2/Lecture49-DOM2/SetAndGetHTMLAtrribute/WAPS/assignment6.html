<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showLink(){
            let a = document.querySelector("a");
            let entry = prompt("Enter website name: ");
            a.setAttribute("href", "https://www." + entry + ".com");
            a.innerHTML = "<br>"+"visit " + entry;
        }
    </script>
</head>
<body>
    <h3>Generate Website Link</h3>
    
    <input type="button" value="create website link"  onclick = "showLink()">
    <a></a>
    <p>In the code shown. write the body of the function showLink()<br>
    so that it prompts the user to input a website name and generates<br>
    a dynamic link to that website on the page.</p>
</body>
</html>
