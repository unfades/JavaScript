<html>

<head>
    <title>Problem with setAttribute</title>
    <script>
        function operate() {
            //Now its fixed with the css .style
            let heading = document.querySelector('h3');
            heading.style.textAlign = "center";
            heading.style.textDecoration = "underline";
            heading.style.fontStyle = "italic";
        }

    </script>
</head>

<body>
    <h3 style="color: blue;">Our Mission</h3>
    <p>
        The mission of the SHARMA COMPUTER ACADEMY is to provide its students with the foundation for lifelong learning
    </p>

    <input type="button" value="Click me" onclick="operate()" />
</body>

</html>
