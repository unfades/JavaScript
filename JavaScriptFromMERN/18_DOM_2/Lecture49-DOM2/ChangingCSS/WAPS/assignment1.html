<html>
  <head>
    <title>Understanding style</title>
    <script>
      function showDate() {
        //Write code to insert current system date in the <p> tag...
        //and it should be in bold and colorshould be crimson...
        let today = new Date();
        let p = document.querySelector("p");
        let str = (today.getMonth()+1) +"-"+(today.getDay()+1)+"-"+today.getFullYear();
        //sir's
        //let str = today.getDate() +"-"+(today.getDay()+1)+"-"+today.getFullYear();
        p.innerHTML += `: ${str}`;
        p.style.fontWeight = "bold";
        p.style.color = "crimson";
      }
    </script>
  </head>

  <body>
    <p>Click the button to display current date</p>
    <input type="button" value="show date" onclick="showDate();" />
  </body>
</html>
