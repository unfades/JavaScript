<html>
  <head>
    <title>Using toString() Method</title>
    <script>
      let friends = ["amit", "vijay", "karan", "ramesh"];
      document.write(`<br>${friends.join("$")}<br>`);
      document.write(`<br>${friends.toString("$")}<br>`);
      document.write(`<br>${friends}<br>`);
    </script>
  </head>

  <body></body>
</html>
