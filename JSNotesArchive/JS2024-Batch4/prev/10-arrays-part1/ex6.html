<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Accessing Array Using for in</title>
		<script>
			let nos = [10, 20, 30, 40, 50, 60, 70];
			for (let i in nos) {
				document.write(`index:${i},value:${nos[i]}<br>`);
			}
		</script>
	</head>
	<body></body>
</html>
