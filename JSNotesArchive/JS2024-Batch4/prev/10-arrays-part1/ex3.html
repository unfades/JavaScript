<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Nature Of Array</title>
    <script>
      let evens = [];
      document.write(`Current size of array is ${evens.length}<br>`); // length is a property in array
      evens[0] = 2;
      evens[1] = 4;
      evens[5] = 6;
      evens[10] = 8;
      document.write(
        `After adding 4 elements size of array is ${evens.length}<br>`
      );
      document.write(`${evens}`);
    </script>
  </head>
  <body></body>
</html>
