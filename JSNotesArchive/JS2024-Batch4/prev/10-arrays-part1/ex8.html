<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessing Array Using For Of Loop</title>
    <script>
      let nos = [10, 20, 30, , , 60, 70];
      for (let x of nos) {
        document.write(`${x}<br>`);
      }
    </script>
  </head>
  <body></body>
</html>
