<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessing Array Using Normal For</title>
    <script>
      let nos = [10, 20, 30, 40, 50, 60, 70];
      for (let i = 0; i < nos.length; i++) {
        document.write(`${nos[i]}<br>`);
      }
    </script>
  </head>
  <body></body>
</html>
