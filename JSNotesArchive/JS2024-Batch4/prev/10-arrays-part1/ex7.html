<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For in does not access undefined cells</title>
    <script>
      let nos = [10, , 30, , 50, 60, 70];
      document.write(`Size of the array is ${nos.length}<br>`);
      for (let i in nos) {
        document.write(`index:${i},value:${nos[i]}<br>`);
      }
    </script>
  </head>
  <body></body>
</html>
