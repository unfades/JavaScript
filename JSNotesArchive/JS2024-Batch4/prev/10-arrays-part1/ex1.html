<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creating Array Using Array Literal</title>
    <script>
      let evens = [2, 4, 6, 8, 10];
      document.write(`${evens}`);
      document.write(`<br>${evens.toString()}`);
      let colors = ["red", "green", "blue"];
      document.write(`<br>${colors}`);
      document.write(`<br>${colors.toString()}`);
    </script>
  </head>
  <body></body>
</html>
