<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Type Conversion Example</title>
    <script>
      let a=Number(prompt("Enter first no"));
      let b=Number(prompt("Enter sec no"));
      let c=a+b;
      document.write(`First num is ${a},Sec number is ${b}<br>`);
      document.write(`Their sum is ${c}`);
    </script>
  </head>
  <body></body>
</html>
