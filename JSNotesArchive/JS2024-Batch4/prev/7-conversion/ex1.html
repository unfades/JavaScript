<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Type Conversion Example</title>
    <script>
      let pi = 3.14;
      let sPi =String(pi);
      let x = pi.toString();
      document.write(`pi is ${pi} and its data type is ${typeof pi}<br>`);
      document.write(`spi is ${sPi} and its data type is ${typeof sPi}<br>`);
      document.write(`x is ${x} and its data type is ${typeof x}<br>`);
    </script>
  </head>
  <body></body>
</html>
