<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Type Conversion Example</title>
    <script>
      let a = 5;
      let b = 10;
      let c = "Sachin";
      let d = true;
      document.write(`${a - b}<br>`);
      document.write(`${a - c}<br>`);
      document.write(`${a - d}<br>`);
      document.write(`${b - c}<br>`);
      document.write(`${a - b - c}<br>`);
      document.write(`${c - d}<br>`);
    </script>
  </head>
  <body></body>
</html>
