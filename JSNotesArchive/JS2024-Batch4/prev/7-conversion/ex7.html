<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Type Conversion Example</title>
    <script>
      let a = 10 / 3;
      document.write(`${a}`);
      let b = a.toFixed(2);
      document.write(`<br>${b}`);
      document.write(`<br>${typeof b}`);
    </script>
  </head>
  <body></body>
</html>
