<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Type Conversion Example</title>
    <script>
      let a = "hello";
      let b = ""; // empty string
      let c = [];//empty array
      let d = {};//empty object
      document.write(`${Boolean(a)}<br>`);
      document.write(`${Boolean(b)}<br>`);
      document.write(`${Boolean(c)}<br>`);
      document.write(`${Boolean(d)}<br>`);
      document.write(`${Boolean(Infinity)}<br>`);
    </script>
  </head>
  <body></body>
</html>
