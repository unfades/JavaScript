<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Function Demo</title>
    <script>
      function showTime() {
        let today = new Date();
        console.log(today);
      }
      function startWatch() {
        setTimeout(showTime, 1000);
      }
    </script>
  </head>
  <body>
    <input type="button" value="Start Time" onclick="startWatch()" />
  </body>
</html>
