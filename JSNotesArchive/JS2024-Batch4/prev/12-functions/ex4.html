<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Function Demo</title>
    <script>
      //design a function called calculate which accepts 3 arguments and displays sum and avg
      function calculate(a, b, c) {
        let sum = a + b + c;
        let avg = sum / 3;
        document.write(`Sum is ${sum}<br>`);
        document.write(`Avg is ${avg.toFixed(2)}<br>`);
      }
      calculate(3, 4, 5);
      calculate(3, 4, 6);
    </script>
  </head>
  <body></body>
</html>
