<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Data Types</title>
    <script>
      let days = ["Monday", "Tuesday", "Wednesday"];
      document.write(days[2]);
      document.write("<br>");
      document.write(days[6]);
      let actor = {
        name: "Manoj",
        surname: "Bajpayee",
        hitSeries: "Family man",
        platform: "amazon prime",
      };
      document.write("<br>");
      document.write(actor.name);
      document.write("<br>");
      document.write(actor.age);
    </script>
  </head>
  <body></body>
</html>
