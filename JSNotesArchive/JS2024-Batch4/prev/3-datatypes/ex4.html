<html lang="en">
  <head>
    <title>Data Types</title>

      let city="Bhopal";

      document.write(typeof city);
      city='Bhopal';
      document.write("<br>");
      document.write(city);
      document.write("<br>");
      document.write(typeof city);
      city='B';

      document.write(typeof city);
      city="B";
      document.write("<br>");
      document.write(city);
      document.write("<br>");
      document.write(typeof city);
      
    </script>
  </head>
  <body></body>
</html>
