<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Relational Operator Demo</title>
    <script>
      let a = 10;
      let b = 10.0;
      let c = "10";
      let d = "10.0";
      let x = true;
      let y = 1;
      document.write(`${a == b}<br>`);
      document.write(`${a == c}<br>`);
      document.write(`${a === b}<br>`);
      document.write(`${a === c}<br>`);
      document.write(`${a == d}<br>`);
      document.write(`${a === d}<br>`);
      document.write(`${x == y}<br>`);
      document.write(`${x === y}<br>`);
      document.write(`${c === d}<br>`);
      document.write(`${c == d}<br>`);
    </script>
  </head>
  <body></body>
</html>
