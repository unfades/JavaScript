<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Displaying A Variable</title>
    <script>
      let name = "Sachin";
      document.write(`My name is ${name} `);
      document.write(`<br>name is of type ${typeof name}<br>`);
      name = 46;
      document.write(`<br>And my age ${name}`);
      document.write(`<br>Now name is of type ${typeof name}<br>`);
    </script>
  </head>
  <body></body>
</html>
