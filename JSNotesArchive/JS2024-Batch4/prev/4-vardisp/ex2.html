<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Displaying A Variable</title>
    <script>
        let name="Sachin";
        let age=45;
      document.write(`My name is ${name} and my age is ${age}`)
      document.write(`<br>After two years my age will be ${age+2}`);
      document.write(`<br>2 to the power 3 is ${Math.pow(2,3)}`)
    </script>
  </head>
  <body></body>
</html>
