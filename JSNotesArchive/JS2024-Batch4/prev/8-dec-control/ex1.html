<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Decsion Control</title>
    <script>
      let n;
      n = prompt("Enter a number");
      if (n === null || isNaN(n) === true) {
        document.write(
          "Either you did not type a number or you did not input a number"
        );
      } else if (n % 2 === 0) {
        document.write(`${n} is an even number`);
      } else {
        document.write(`${n} is an odd number`);
      }
    </script>
  </head>
  <body></body>
</html>
