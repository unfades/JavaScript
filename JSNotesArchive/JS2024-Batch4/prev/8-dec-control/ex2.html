<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Decsion Control</title>
    <script>
      let ch;
      ch = prompt("Enter a character");
      let ch2=ch;
      ch=ch.toUpperCase();
      switch(ch){
        case "A": case "E": case "I": case "O": case "U":
            document.write(`${ch2} is a vowel`);
            break;
        default:
        document.write(`${ch2} is not a vowel`);

      }
      
    </script>
  </head>
  <body></body>
</html>
