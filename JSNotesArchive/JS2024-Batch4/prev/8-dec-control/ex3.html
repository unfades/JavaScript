<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Decsion Control</title>
    <script>
      let age;
      age = Number(prompt("Enter your age:"));
      let msg;
      msg = age >= 18 ? "You can vote" : "You cannot vote";
      document.write(`Your age is ${age}<br>${msg}`);
    </script>
  </head>
  <body></body>
</html>
