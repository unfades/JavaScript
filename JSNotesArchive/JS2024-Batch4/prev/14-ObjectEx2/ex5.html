<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Understanding this</title>
    <script>
      var x = 10;
      function show(){
        var x=20;
        document.write(`${x}<br>`);
        document.write(`${window.x}<br>`);
        document.write(`${this.x}<br>`);

      }
      show();
    </script>
  </head>
  <body></body>
</html>
