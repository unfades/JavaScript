<html>
  <head>
    <title>Using for each</title>
    <script>
      let arr = [10, 3, 14, 5, 6, 7, 18];
      arr.forEach((x, i) => {
        console.log(i);
        
        if (x % 2 === 0) {
          console.log(`index ${i},value ${x}`);
        }
      });
    </script>
  </head>

  <body></body>
</html>
