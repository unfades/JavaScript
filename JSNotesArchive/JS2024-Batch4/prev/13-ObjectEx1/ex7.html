<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Creating Multiple Objects</title>
    <script>
      let myCar1 = new Object();
      myCar1.name = "Baleno";
      myCar1.year = 2018;
      myCar1.color = "blue";
      
      let myCar2=new Object();
      myCar2.name = "i10";
      myCar2.year = 2020;
      myCar2.color = "green";
      myCar2.audioSystem="Kenwood";
      console.log(myCar1);
      console.log(myCar2);
      
      
    </script>
  </head>
  <body></body>
</html>
