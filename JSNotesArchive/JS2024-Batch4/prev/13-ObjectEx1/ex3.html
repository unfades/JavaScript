<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Adding multiword property</title>
    <script>
      let myCar = new Object();
      myCar.name = "Baleno";
      myCar.year = 2018;
      myCar.color = "blue";
      myCar["reg no"] = "MP041234";
      console.log(myCar.name);
      console.log(myCar.year);
      console.log(myCar.color);
      console.log(myCar["reg no"]);
    </script>
  </head>
  <body></body>
</html>
