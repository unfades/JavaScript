<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Adding Methods Into Object</title>
    <script>
      let myCar1 = new Object();
      myCar1.name = "Baleno";
      myCar1.year = 2018;
      myCar1.color = "blue";
      myCar1["start"]=function(){
        console.log("Car is starting...");
        
      }
     myCar1.start();
    </script>
  </head>
  <body></body>
</html>
