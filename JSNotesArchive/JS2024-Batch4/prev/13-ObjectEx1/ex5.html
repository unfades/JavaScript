<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Changing property values</title>
    <script>
      let myCar = new Object();
      myCar.name = "Baleno";
      myCar.year = 2018;
      myCar.color="blue";
      console.log(myCar.name);
      console.log(myCar.year);
      console.log(myCar.color);
      myCar.color="orange";
      console.log("After changing color");
      console.log(myCar.color);
      
      
    </script>
  </head>
  <body></body>
</html>
