<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Creating Object Using Object Literal</title>
    <script>
      let myCar = { 
                    name: "Baleno", 
                    year: 2018, 
                    color: "blue",
                    start:function(){
                            console.log("Car is starting");        
                    } 
                };
      console.log(myCar.name);
      console.log(myCar.year);
      console.log(myCar.color);
      myCar.start();
    </script>
  </head>
  <body></body>
</html>
