<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Adding property using []</title>
    <script>
      let player = new Object();
      player["name"] = "Virat";
      player["surname"] = "Kohli";
      player["age"] = 36;
      
      console.log(player); // will show all the properties and values
      console.log(player["name"]); //Virat
      console.log(player["age"]); //36
      console.log(player["surname"]); //Kohli
    </script>
  </head>
  <body></body>
</html>
