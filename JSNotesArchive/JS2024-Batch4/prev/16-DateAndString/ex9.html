<!DOCTYPE html>
<html lang="en">
  <head>
    <title>String handling</title>
    <script>
      function show() {
        let city = "bhopal";
        document.write(
          `Index of p in ${city} is ${city.indexOf("p")}`
        );
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="show()">Click me</button>
  </body>
</html>
