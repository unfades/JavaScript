<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Date In JS</title>
    <script>
      function showDate() {
        let indep1=new Date("1947-08-15");
        document.write(`${indep1}`);
        let indep2=new Date("08/15/1947");
        document.write(`<br>${indep2}`);
        let indep3=new Date("Aug 15,1947");
        document.write(`<br>${indep3}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="showDate()">Show Current Date</button>
  </body>
</html>
