<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Date In JS</title>
    <script>
      function showDate() {
        let indep1 = new Date(1947, 7, 15);
        document.write(`${indep1}`);
        let dob = new Date(2002,5,15,15,0,0);
        document.write(`<br>${dob}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="showDate()">Show Current Date</button>
  </body>
</html>
