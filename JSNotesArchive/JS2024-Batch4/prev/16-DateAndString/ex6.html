<!DOCTYPE html>
<html lang="en">
  <head>
    <title>String handling</title>
    <script>
      function show() {
        let myName = "Sachin Kapoor";
        document.write(`Length of ${myName} is ${myName.length}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="show()">Click me</button>
  </body>
</html>
