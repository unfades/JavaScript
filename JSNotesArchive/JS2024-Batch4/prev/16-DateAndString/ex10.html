<!DOCTYPE html>
<html lang="en">
  <head>
    <title>String handling</title>
    <script>
      function show() {
        let city = "bhopal";
        document.write(`${city.substring(3,6)}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="show()">Click me</button>
  </body>
</html>
