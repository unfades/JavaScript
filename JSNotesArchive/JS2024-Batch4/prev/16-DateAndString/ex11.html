<!DOCTYPE html>
<html lang="en">
  <head>
    <title>String handling</title>
    <script>
      function show() {
        let city = "Bhopal";
        document.write(`${city.toLowerCase()}`);
        document.write(`<br>${city.toUpperCase()}`);
        document.write(`<br>${city}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="show()">Click me</button>
  </body>
</html>
