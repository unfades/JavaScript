<!DOCTYPE html>
<html lang="en">
<head>
    <title>Date In JS</title>
    <script>
        function showDate(){
            let now=new Date();
            document.write(`${now}`);
        }
    </script>
</head>
<body>
    <button type="button" onClick="showDate()">Show Current Date</button>
</body>
</html>
