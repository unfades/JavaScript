<!DOCTYPE html>
<html lang="en">
  <head>
    <title>String handling</title>
    <script>
      function show() {
        let myName="Sachin";
        document.write(`My name is ${myName}`);
      }
    </script>
  </head>
  <body>
    <button type="button" onClick="show()">Click me</button>
  </body>
</html>
