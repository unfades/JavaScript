<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Loop Demo</title>
    <script>
      let n=Number(prompt("Enter a number:"));
      document.write(`Table of ${n}<br>`);
      let i=1;
      while(i<=10){
        document.write(`${n} x ${i} = ${n*i}<br>`);
        i++;
      }
    </script>
  </head>
  <body></body>
</html>
